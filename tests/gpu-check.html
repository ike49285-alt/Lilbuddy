<!doctype html>
<meta charset="utf-8">
<title>GPU river check</title>
<script type="module">
// The same world run with the river on the CPU and on the GPU: how far
// apart they end up. Read by tests/gpu.test.mjs.
import { Simulation } from '../src/sim.js';
import { GpuRiver } from '../src/gpuriver.js';
import { gpuAvailable } from '../src/gpu.js';
import { TUNE } from '../src/flow.js';
const q = new URLSearchParams(location.search);
const seed = q.get('seed') || 'gpu-1', warm = Number(q.get('warm') || 600), n = Number(q.get('steps') || 200), morph = Number(q.get('morph') || 1);
const out = { available: gpuAvailable() };
const years = Number(q.get('years') || 0);
if (years > 0) {
  // A long run each way from a bare plain: does the river come out the same?
  const run = (useGpu, nudge = 0) => {
    const s = new Simulation(seed);
    if (useGpu) { s.flow.gpu = new GpuRiver(s.flow); s.flow.gpu.blocking = true; s.flow.gpu.debug = !!q.get('debug'); }
    const fr = TUNE.frMax;
    TUNE.frMax = fr * (1 + nudge);
    const t0 = performance.now();
    while (s.years < years) s.step(20000);
    s.flow.gpuSync();
    const m = s.measure(), st = s.stats(m);
    TUNE.frMax = fr;
    const f = s.flow;
    if (f.gpu) f.gpu.dispose();
    return { width: m.width, sinuosity: m.sinuosity, delta: st.delta, mudLaid: st.mudLaid, fedIn: f.fedIn, toSea: f.toSea, slides: f.slides, trees: st.trees, plants: st.plants, rockWorn: f.rockWorn, years: s.years, sec: (performance.now() - t0) / 1000 };
  };
  try {
    out.cpu = run(false);
    if (q.get('more')) out.cpuNudged = run(false, 1e-4);
    out.gpu = run(true);
  } catch (e) { out.error = String(e && e.stack || e); }
  window.result = out;
} else try {
  const base = q.has('hills') ? new Simulation(seed, { hills: Number(q.get('hills')) }) : new Simulation(seed);
  for (let k = 0; k < warm; k++) base.step(morph);
  // A dam's reservoir, its still water blended face to face.
  if (q.get('dam')) { base.place('dam', 0, [[0.5, 110.5], [127.5, 110.5]], 'medium'); for (let k = 0; k < 100; k++) base.step(morph); }
  const state = base.saveState();
  const cpu = Simulation.fromState(structuredClone(state));
  const gpu = Simulation.fromState(structuredClone(state));
  gpu.flow.gpu = new GpuRiver(gpu.flow);
  gpu.flow.gpu.blocking = true;
  let t0 = performance.now();
  for (let k = 0; k < n; k++) cpu.step(morph);
  out.cpuMs = (performance.now() - t0) / n;
  t0 = performance.now();
  for (let k = 0; k < n; k++) gpu.step(morph);
  gpu.flow.gpuSync();
  out.gpuMs = (performance.now() - t0) / n;
  const a = cpu.flow, b = gpu.flow;
  let wet = 0, close = 0, worst = 0, va = 0, vb = 0, ma = 0, mb = 0, za = 0, ga = 0, gb = 0, sa = 0, sb = 0;
  for (let i = 0; i < a.N; i++) {
    va += a.h[i]; vb += b.h[i]; ma += a.M[i]; mb += b.M[i];
    ga += a.z[i]; gb += b.z[i];
    sa += a.fm[i] * a.z[i]; sb += b.fm[i] * b.z[i];
    za = Math.max(za, Math.abs(a.z[i] - b.z[i]));
    if (a.h[i] > 0.02 || b.h[i] > 0.02) { wet++; const d = Math.abs(a.h[i] - b.h[i]); if (d < 0.01) close++; if (d > worst) { worst = d; out.worstAt = [i % a.W, (i / a.W) | 0, a.h[i], b.h[i], a.z[i], b.z[i], a.still[i]]; } }
  }
  if (a.hasStill) {
    // The reservoir's surface, each way.
    let n = 0, sa = 0, sb = 0, dev = 0, far = 0;
    for (let i = 0; i < a.N; i++) if (a.still[i] && a.h[i] > 0.3) { n++; sa += a.h[i] + a.z[i]; sb += b.h[i] + b.z[i]; const d = Math.abs(a.h[i] + a.z[i] - b.h[i] - b.z[i]); dev += d; if (d > 0.1) far++; }
    out.lake = { n, cpu: sa / n, gpu: sb / n, meanDiff: dev / n, over10cm: far };
  }
  Object.assign(out, { wet, close: close / wet, worst, water: [va * 16, vb * 16], mud: [ma * 16, mb * 16], bedDiff: za, years: [cpu.years, gpu.years], dt: [a.dt, b.dt],
    ground: [ga * 16, gb * 16], fedIn: [a.fedIn, b.fedIn], toSea: [a.toSea, b.toSea], mudLaid: [a.mudLaid, b.mudLaid], mNow: [a.mNow, b.mNow] });
  gpu.flow.gpu.dispose();
} catch (e) { out.error = String(e && e.stack || e); }
if (!(years > 0)) window.result = out;
</script>
