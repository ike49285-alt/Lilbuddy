<!doctype html>
<meta charset="utf-8">
<title>GPU water check</title>
<script type="module">
// The same world run with the water on the CPU and on the GPU: how far
// apart they end up. Read by tests/gpu.test.mjs.
import { Simulation } from '../src/sim.js';
import { GpuWater } from '../src/gpuflow.js';
import { gpuAvailable } from '../src/gpu.js';
import { TUNE } from '../src/flow.js';
const q = new URLSearchParams(location.search);
const seed = q.get('seed') || 'gpu-1', warm = Number(q.get('warm') || 600), n = Number(q.get('steps') || 200), morph = Number(q.get('morph') || 1);
const out = { available: gpuAvailable() };
const years = Number(q.get('years') || 0);
if (years > 0) {
  // A long run each way from a bare plain: does the river come out the same?
  const run = (useGpu, wait = false, nudge = 0) => {
    const s = new Simulation(seed);
    if (useGpu) { s.flow.gpu = new GpuWater(s.flow); s.flow.gpu.waitEachTime = wait; }
    const fr = TUNE.frMax;
    TUNE.frMax = fr * (1 + nudge);
    const t0 = performance.now();
    while (s.years < years) s.step(20000);
    const m = s.measure(), st = s.stats(m);
    TUNE.frMax = fr;
    return { width: m.width, sinuosity: m.sinuosity, delta: st.delta, mudLaid: st.mudLaid, sec: (performance.now() - t0) / 1000 };
  };
  try {
    out.cpu = run(false);
    if (q.get('more')) { out.cpuNudged = run(false, false, 1e-4); out.gpuWaiting = run(true, true); }
    out.gpu = run(true);
  } catch (e) { out.error = String(e && e.stack || e); }
  window.result = out;
} else try {
  const base = new Simulation(seed);
  for (let k = 0; k < warm; k++) base.step(morph);
  const state = base.saveState();
  const cpu = Simulation.fromState(structuredClone(state));
  const gpu = Simulation.fromState(structuredClone(state));
  gpu.flow.gpu = new GpuWater(gpu.flow);
  let t0 = performance.now();
  for (let k = 0; k < n; k++) cpu.step(morph);
  out.cpuMs = (performance.now() - t0) / n;
  t0 = performance.now();
  for (let k = 0; k < n; k++) gpu.step(morph);
  gpu.flow.gpuSync();
  out.gpuMs = (performance.now() - t0) / n;
  const a = cpu.flow, b = gpu.flow;
  let wet = 0, close = 0, worst = 0, va = 0, vb = 0, ma = 0, mb = 0, za = 0;
  for (let i = 0; i < a.N; i++) {
    va += a.h[i]; vb += b.h[i]; ma += a.M[i]; mb += b.M[i];
    za = Math.max(za, Math.abs(a.z[i] - b.z[i]));
    if (a.h[i] > 0.02 || b.h[i] > 0.02) { wet++; const d = Math.abs(a.h[i] - b.h[i]); if (d < 0.01) close++; worst = Math.max(worst, d); }
  }
  Object.assign(out, { wet, close: close / wet, worst, water: [va * 16, vb * 16], mud: [ma * 16, mb * 16], bedDiff: za, years: [cpu.years, gpu.years], dt: [a.dt, b.dt] });
} catch (e) { out.error = String(e && e.stack || e); }
if (!(years > 0)) window.result = out;
</script>
